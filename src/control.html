<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"><title>شمارنده فارسی</title><link rel="stylesheet" href="style.css"></head>
<body><main class="layout"><header class="heading"><div><h1>شمارنده فارسی</h1><p>کنترل نمایش و فراخوانی</p></div><button id="display" class="secondary">باز کردن نمایشگر دوم</button></header>
<section class="counter-panel" aria-labelledby="current-title"><div><p id="current-title" class="label">پیش‌نمایش عدد</p><output id="current" class="number" aria-live="polite">۰</output></div><button id="increment" class="primary">افزایش عدد +</button></section>
<div class="columns"><section class="card"><h2>عدد و ظاهر</h2><form id="number-form"><label for="number">عدد ثابت</label><div class="row"><input id="number" type="text" inputmode="numeric" autocomplete="off" required><button type="submit" class="secondary">ثبت عدد</button></div></form><div class="fields appearance"><div><label for="color">رنگ عدد</label><input type="color" id="color" value="#ffffff"></div><div><label for="font">فونت عدد</label><select id="font"><option value="vazirmatn">وزیرمتن</option><option value="plex">آی‌بی‌ام پلکس عربی</option></select></div></div></section>
<section class="card"><h2>خواندن عدد</h2><form id="settings-form"><div class="fields"><div><label for="repeats">تعداد تکرار</label><input id="repeats" type="text" inputmode="numeric" autocomplete="off" required></div><div><label for="interval">فاصله (ثانیه)</label><input id="interval" type="text" inputmode="numeric" autocomplete="off" required></div></div><div class="row actions"><button type="submit" class="secondary">ذخیره تنظیمات</button><button type="button" id="read" class="primary">خواندن عدد</button><button type="button" id="stop" class="secondary" disabled>توقف</button></div></form></section></div>
<p id="status" role="status" aria-live="polite" class="status">آماده</p></main><script src="audio.js"></script><script src="control.js"></script></body></html>
